[project]
name = "Vendange"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]",
    "fastapi-cli>=0.0.5",
    "uvicorn[standard]",
    "pydantic",
    "python-multipart",
    "rich>=14.2.0",
    "pip>=25.2",
    "numpy==1.26.4",
    "curated-tokenizers==0.0.9",
    "curated-transformers==0.1.1",
    "filelock==3.20.0",
    "fsspec==2025.9.0",
    "mpmath==1.3.0",
    "networkx==3.5",
    "protobuf==3.20.3",
    "regex==2025.10.23",
    "sentencepiece==0.2.1",
    "spacy-curated-transformers==0.3.1",
    "sympy==1.14.0",
    "torch==2.2.2",
    "pyoxigraph>=0.5.2",
    "oxigraph>=0.5.2",
    "spacy==3.8.7",
    "fr_dep_news_trf==3.8.0",
    "google-genai>=1.50.1",
    "pytest>=9.0.1",
    "pytest-playwright>=0.3.0",
]

[tool.uv]
dev-dependencies = ["ruff>=0.6.2"]

[dependency-groups]
dev = ["marimo>=0.17.6", 
    "matplotlib>=3.10.7",
    "pandas>=2.3.3",
]

[tool.uv.sources]
fr-dep-news-trf = { url = "https://github.com/explosion/spacy-models/releases/download/fr_dep_news_trf-3.8.0/fr_dep_news_trf-3.8.0-py3-none-any.whl" }
